<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>emrc-geapp</title>
    <!--
      Inter Tight, from Google Fonts — used only on the public landing pages
      (public gateway `/` and `/progress`), scoped there via the
      `.font-landing` rule in src/index.css. Every other page keeps the
      self-hosted Google Sans (see src/styles/fonts.css) so the authenticated
      app has no runtime font-CDN dependency; the landing pages are the one
      deliberate exception.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
